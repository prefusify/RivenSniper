[project]
name = "RivenSniper"
version = "9.0.2"
license = "MIT"
description = "Warframe 紫卡与道具监控、频道采集及多目标推送服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-adapter-discord>=1.1.9,<2.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
